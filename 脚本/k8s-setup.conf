# K8S 安装器配置样例：仅在 --config ./k8s-setup.conf 时读取。
# 格式为 KEY=value；不写 export，不加引号，不写行末注释，不会执行 shell 表达式。
# 节点名/IP 通过 --name 和 --ip 传入，所以同一份配置可以用于多台机器。
# worker 的版本、镜像仓库、集群网段会从 master 的加入 JSON 读取，优先于本文件。

# === 软件版本 ===
# 固定补丁版本，不跟随 latest 自动升级。更换版本先确认所选 RPM 源有对应包。
# 新建集群用此版本安装 RPM 和控制平面；脚本不是已有集群的升级工具。
# join-info/cni 会读取真实控制平面和本机 RPM 版本，允许同一小版本内的补丁差异。
# worker 的组件 RPM 版本取自加入文件的 kubernetesPackageVersion（v1 文件用 kubernetesVersion）。
K8S_VERSION=1.37.1
CONTAINERD_VERSION=2.4.1

# === RPM 来源与控制平面镜像 ===
# aliyun：阿里 RPM 镜像；official：pkgs.k8s.io + download.docker.com。
# MIRROR 只选择 RPM 来源，不会顺带改容器镜像仓库。
MIRROR=aliyun
IMAGE_REPOSITORY=registry.aliyuncs.com/google_containers
# 如果使用官方容器镜像，把上一项改为 registry.k8s.io。
# 国内 RPM 源可达，不代表 GitHub、ghcr.io 或其他容器仓库也一定可达。

# 可选：覆盖具体 RPM 源地址。留空则根据版本/架构自动生成。
# 地址必须具体、可访问；不支持 $releasever / $basearch 等 shell 变量展开。
K8S_BASEURL=
K8S_GPGKEY=
CONTAINERD_BASEURL=
CONTAINERD_GPGKEY=

# === RHEL BaseOS / AppStream，下面三种方式三选一 ===
# 方式 1（默认）：以下均留空，使用系统已经启用、可用的 RHEL 源。
# 方式 2：指定现有仓库 ID，只在本次 DNF 操作中启用它们。
# 例如 OS_REPO_IDS=rhel-9-for-x86_64-baseos-rpms,rhel-9-for-x86_64-appstream-rpms
OS_REPO_IDS=
# 方式 3：同时填写与你的 RHEL 9 版本、架构匹配的两个 URL。
# 光盘已挂载到 /mnt/rhel 时可填写：
# BASEOS_URL=file:///mnt/rhel/BaseOS/
# APPSTREAM_URL=file:///mnt/rhel/AppStream/
# 也支持你自己的 http(s):// 局域网 RHEL 镜像；不会使用参考里的固定 192.168.1.192。
BASEOS_URL=
APPSTREAM_URL=
RHEL_GPGKEY=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
# 使用方式 3 时，只在本次 DNF 调用禁用 subscription-manager 插件和其他仓库。
# 不注销订阅、不修改其他 repo 文件。脚本本身不能提供 RHEL 订阅或安装镜像。

# === 集群网络 ===
# POD_CIDR 给 Pod 使用，SERVICE_CIDR 给 Service 使用，二者与主机网络均不可重叠。
# Flannel 的 Network 必须等于 POD_CIDR，不能填成 SERVICE_CIDR。
POD_CIDR=10.244.0.0/16
SERVICE_CIDR=10.96.0.0/12
# 新建集群默认 iptables；可选 ipvs，会额外安装/加载所需工具和模块。
# 在本脚本适配的 RHEL 9 中，iptables 命令可由 iptables-nft 提供。
KUBE_PROXY_MODE=iptables

# === 实验环境系统策略 ===
# disable：关闭 firewalld，与笔记的独立实验网络一致。
# keep：保留现状；你需保证 API、kubelet、VXLAN、Pod 流量和所需业务端口能通。
# keep 不表示“脚本自动放行端口”。不建议直接用于生产环境。
FIREWALL_MODE=disable
# SELinux 使用 permissive；不会写错误的 SELINUX=disable，也不改启动参数。

# === Flannel ===
# 默认清单已核对 SHA256；换版本/自定义清单时必须同时更改对应 SHA256。
FLANNEL_VERSION=v0.28.10
FLANNEL_SHA256=393bdbce53eb50c8eb97dd513b218518b7d6e7985dc7b889be956e112a711084
# 留空使用 GitHub 发布页地址。无法访问时可指定可信内网 URL 或 file:///绝对路径。
FLANNEL_URL=
# 默认镜像在 ghcr.io/flannel-io 下。若提前同步到自己的仓库，可填新的目录前缀。
# 例如同步同名同 tag 镜像到 registry.example.com/flannel，则填写此目录前缀。
# 只改前缀并不会同步镜像；该目录必须真实存在、节点能下载且无需额外登录配置。
FLANNEL_IMAGE_PREFIX=

# 每个就绪等待步骤的超时（秒），以及新加入凭据的有效期（小时）。
WAIT_SECONDS=600
JOIN_TTL_HOURS=24
